; PlatformIO Project Configuration File para o Traçador I-V e Estação Meteorológica
; Placa: Heltec WiFi LoRa 32 (V2)

[platformio] 
default_envs = receptor // Define o ambiente padrão como "receptor" para compilar e carregar o código do receptor por padrão.

[env] // Configurações comuns para todos os ambientes
platform = espressif32 // Define a plataforma como ESP32, que é a base para o desenvolvimento do firmware.
framework = arduino // Define o framework como Arduino, permitindo o uso das bibliotecas e funções do Arduino.
monitor_speed = 115200 // Define a velocidade de comunicação serial para monitoramento como 115200 bps.

[env:receptor] // Configurações específicas para o ambiente "receptor"
board = heltec_wifi_lora_32_V2 // Define a placa como Heltec WiFi LoRa 32 (V2).
build_src_filter = +<main_receptor.cpp> +<web_dashboard.h> +<web_teste.h> -<main_emissor.cpp> // Filtra os arquivos de origem para incluir apenas os arquivos relevantes para o receptor, excluindo o código do emissor.
lib_deps = // Lista de dependências de bibliotecas necessárias para o receptor
    sandeepmistry/LoRa@^0.8.0
    4-20ma/ModbusMaster@^2.0.1
    adafruit/RTClib@^2.1.4
    olikraus/U8g2@^2.36.5
    ESP32Async/ESPAsyncWebServer@^3.7.1
    ESP32Async/AsyncTCP@^3.3.2

[env:emissor] // Configurações específicas para o ambiente "emissor"
board = heltec_wifi_lora_32_V2 // Define a placa como Heltec WiFi LoRa 32 (V2).
build_src_filter = +<main_emissor.cpp> -<main_receptor.cpp> // Filtra os arquivos de origem para incluir apenas os arquivos relevantes para o emissor, excluindo o código do receptor.
lib_deps = // Lista de dependências de bibliotecas necessárias para o emissor
    sandeepmistry/LoRa@^0.8.0
    heltecautomation/Heltec ESP32 Dev-Boards@^2.0.2
